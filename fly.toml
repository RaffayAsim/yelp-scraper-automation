# Generated by fly launch — edit app name to match yours
app = "yelp-scraper-automation"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  EXTENSION_PATH = "/app/Yelp Extntino/original-src"
  CHROME_USER_DATA_DIR = "/data/chrome-profile"
  EXPORTS_DIR = "/data/exports"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[[mounts]]
  source = "yelp_data"
  destination = "/data"
  initial_size = "5gb"
