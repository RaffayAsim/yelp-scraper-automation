<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    body {
      width: 320px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .api-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease;
    }

    .api-badge.online {
      background-color: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.2);
      color: var(--accent-emerald);
    }

    .api-badge.offline {
      background-color: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
    }

    .api-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .status-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .status-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .status-value {
      font-size: 16px;
      font-weight: 600;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      background-color: #4b5563;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(75, 85, 99, 0.2);
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background-color: var(--accent-emerald);
      box-shadow: 0 0 10px var(--accent-emerald), 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      padding: 11px 16px;
      background-color: var(--primary);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .btn-secondary:hover {
      background-color: var(--accent-red);
      color: white;
    }

    .server-list-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .servers-scroll {
      max-height: 190px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    /* Custom Scrollbar */
    .servers-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .servers-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .servers-scroll::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 2px;
    }

    .server-item {
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .server-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: #475569;
    }

    .server-item.active {
      background-color: rgba(99, 102, 241, 0.1);
      border-color: var(--primary);
    }

    .server-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .server-flag {
      font-size: 18px;
      line-height: 1;
    }

    .server-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .server-name {
      font-size: 13px;
      font-weight: 500;
    }

    .server-host {
      font-size: 10px;
      color: var(--text-muted);
    }

    .server-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .latency-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .latency-badge.excellent {
      color: var(--accent-emerald);
      background-color: rgba(16, 185, 129, 0.1);
    }

    .latency-badge.good {
      color: #eab308;
      background-color: rgba(234, 179, 8, 0.1);
    }

    .latency-badge.poor {
      color: var(--accent-red);
      background-color: rgba(239, 68, 68, 0.1);
    }

    .active-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      display: none;
    }

    .server-item.active .active-indicator {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-logo">K</div>
      <h3>Kurva Proxy</h3>
    </div>
    <div id="api-status" class="api-badge">
      <span class="api-dot"></span>
      <span id="api-status-text">Checking API...</span>
    </div>
  </div>

  <div class="status-container">
    <div class="status-info">
      <span class="status-label">Current Connection</span>
      <span id="status-text" class="status-value">Disconnected</span>
    </div>
    <span id="status-indicator" class="status-dot"></span>
  </div>
  
  <div class="actions-grid">
    <button id="connect-best-btn" class="btn">
      ⚡ Connect to Best Server
    </button>
    <button id="disconnect-btn" class="btn btn-secondary">
      ✕ Disconnect
    </button>
  </div>

  <div class="server-list-header">Available Locations:</div>
  <div class="servers-scroll" id="servers-container">
    <!-- Server list populated dynamically -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
