<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yelp Scraper Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23020617'/%3E%3Ccircle cx='24' cy='24' r='10' fill='%2367e8f9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#020617'
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0b1020;
    }

    .grid-noise {
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .amber-badge {
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.22), 0 0 24px rgba(251, 191, 36, 0.15);
    }

    .scroll-soft::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    .scroll-soft::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
    }

    .scroll-soft::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .feed-shell {
      position: relative;
      overflow: hidden;
      border-radius: 1rem;
      background:
        radial-gradient(circle at top right, rgba(34, 211, 238, 0.08), transparent 32%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.015));
    }

    .feed-shell::before,
    .feed-shell::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 22px;
      pointer-events: none;
      z-index: 3;
    }

    .feed-shell::before {
      top: 0;
      background: linear-gradient(180deg, rgba(11, 16, 32, 0.95), rgba(11, 16, 32, 0));
    }

    .feed-shell::after {
      bottom: 0;
      background: linear-gradient(0deg, rgba(11, 16, 32, 0.95), rgba(11, 16, 32, 0));
    }

    .feed-head {
      position: sticky;
      top: 0;
      z-index: 2;
      backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(9, 14, 29, 0.94), rgba(9, 14, 29, 0.82));
    }

    .lead-row {
      background: rgba(255, 255, 255, 0.018);
    }

    .lead-row:nth-child(even) {
      background: rgba(255, 255, 255, 0.03);
    }

    .lead-row:hover {
      background: rgba(51, 65, 85, 0.34);
    }

    .lead-name {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .lead-index {
      flex: 0 0 auto;
      min-width: 2rem;
      height: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: rgb(148 163 184);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .lead-title {
      color: rgb(241 245 249);
      font-weight: 600;
      line-height: 1.35;
    }

    .lead-subtle {
      margin-top: 0.2rem;
      color: rgb(148 163 184);
      font-size: 11px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
  </style>
</head>
<body class="min-h-screen bg-midnight text-slate-50">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

  <script>
    const { useEffect, useMemo, useRef, useState } = React;
    const html = htm.bind(React.createElement);

    const initialJob = {
      status: 'idle',
      phase: 'Ready',
      progress: 0,
      platform: 'yelp',
      keyword: '',
      location: '',
      searchDomain: '',
      yelpDomain: '',
      leadsTotal: 0,
      leadsFiltered: 0,
      elapsedSeconds: 0,
      previewLeads: [],
      fileUrl: null,
      error: null
    };

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatTime(seconds) {
      const safe = Number(seconds) || 0;
      if (safe < 60) return `${safe}s`;
      const m = Math.floor(safe / 60);
      const s = safe % 60;
      return `${m}m ${String(s).padStart(2, '0')}s`;
    }

    function statusTone(status) {
      if (status === 'running') return 'text-cyan-300 border-cyan-400/30 bg-cyan-500/10';
      if (status === 'completed') return 'text-emerald-300 border-emerald-400/30 bg-emerald-500/10';
      if (status === 'failed') return 'text-rose-300 border-rose-400/30 bg-rose-500/10';
      return 'text-slate-300 border-white/10 bg-white/5';
    }

    function platformLabel(platform) {
      if (platform === 'google_maps') return 'Google Maps';
      if (platform === 'facebook_pages') return 'Facebook Pages';
      if (platform === 'kickstarter') return 'Kickstarter';
      if (platform === 'apollo') return 'Apollo';
      return 'Yelp';
    }

    function App() {
      const [platform, setPlatform] = useState('yelp');
      const [keyword, setKeyword] = useState('');
      const [location, setLocation] = useState('');
      const [domain, setDomain] = useState('www.yelp.com');
      const [job, setJob] = useState(initialJob);
      const [estimate, setEstimate] = useState(null);
      const [infoMessage, setInfoMessage] = useState('Launch a scrape job to stream progress and export no-website leads.');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [currentJobId, setCurrentJobId] = useState(null);
      const eventSourceRef = useRef(null);

      const isRunning = job.status === 'running';
      const isCompleted = job.status === 'completed';
      const isFailed = job.status === 'failed';
      const previewRows = Array.isArray(job.previewLeads) ? job.previewLeads : [];

      const stats = useMemo(() => {
        return [
          { label: 'Elapsed', value: formatTime(job.elapsedSeconds) },
          { label: 'Leads Found', value: String(job.leadsTotal || 0) },
          { label: 'No Website', value: String(job.leadsFiltered || 0) }
        ];
      }, [job.elapsedSeconds, job.leadsTotal, job.leadsFiltered]);

      useEffect(() => {
        if (platform === 'google_maps') {
          setDomain('www.google.com');
        } else if (platform === 'facebook_pages') {
          setDomain('www.facebook.com');
        } else if (platform === 'kickstarter') {
          setDomain('www.kickstarter.com');
        } else if (platform === 'apollo') {
          setDomain('app.apollo.io');
        } else {
          setDomain('www.yelp.com');
        }
      }, [platform]);

      useEffect(() => {
        return () => closeStream();
      }, []);

      useEffect(() => {
        const k = keyword.trim();
        const l = location.trim();

        if (!k || (!l && platform !== 'kickstarter' && platform !== 'apollo')) {
          setEstimate(null);
          return;
        }

        const timer = setTimeout(async () => {
          try {
            const res = await fetch(`/api/estimate?keyword=${encodeURIComponent(k)}&location=${encodeURIComponent(l)}&platform=${encodeURIComponent(platform)}&domain=${encodeURIComponent(domain)}`);
            const data = await res.json();
            if (data && data.estimatedSeconds) {
              const minutes = Math.max(1, Math.ceil(Number(data.estimatedSeconds) / 60));
              setEstimate({ minutes, runsCount: data.runsCount || 0 });
            } else {
              setEstimate(null);
            }
          } catch (err) {
            setEstimate(null);
          }
        }, 350);

        return () => clearTimeout(timer);
      }, [keyword, location, platform, domain]);

      function closeStream() {
        if (eventSourceRef.current) {
          eventSourceRef.current.close();
          eventSourceRef.current = null;
        }
      }

      function connectStream(jobId) {
        closeStream();
        setCurrentJobId(jobId);

        const stream = new EventSource(`/api/scrape/${jobId}/events`);
        eventSourceRef.current = stream;

        stream.onmessage = (event) => {
          const next = JSON.parse(event.data);
          setJob(next);

          if (next.status === 'completed') {
            setInfoMessage(`Run complete in ${formatTime(next.elapsedSeconds)}. Download your filtered file.`);
            setIsSubmitting(false);
            closeStream();
          } else if (next.status === 'failed') {
            setInfoMessage(`Job failed: ${next.error || 'Unknown error'}`);
            setIsSubmitting(false);
            closeStream();
          } else {
            setInfoMessage('Scrape running. Lead stream and metrics are updating.');
          }
        };

        stream.onerror = async () => {
          closeStream();
          if (!jobId) return;

          try {
            const res = await fetch(`/api/scrape/${jobId}/status`);
            if (!res.ok) {
              setIsSubmitting(false);
              setInfoMessage('Connection lost while tracking this scrape.');
              return;
            }
            const latest = await res.json();
            setJob(latest);

            if (latest.status === 'running') {
              setInfoMessage('Live stream interrupted. Showing latest known status.');
            }

            if (latest.status === 'completed' || latest.status === 'failed') {
              setIsSubmitting(false);
            }
          } catch (err) {
            setIsSubmitting(false);
            setInfoMessage('Could not recover status after stream error.');
          }
        };
      }

      async function handleSubmit(event) {
        event.preventDefault();

        const k = keyword.trim();
        const l = location.trim();
        if (!k || (!l && platform !== 'kickstarter' && platform !== 'apollo')) return;

        setIsSubmitting(true);
        setInfoMessage('Creating scrape job and opening Chrome...');
        setJob({
          ...initialJob,
          status: 'running',
          phase: 'Submitting job',
          progress: 5,
          platform,
          keyword: k,
          location: l,
          searchDomain: domain,
          yelpDomain: domain
        });

        try {
          const response = await fetch('/api/scrape', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ keyword: k, location: l, platform, search_domain: domain, yelp_domain: domain })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Failed to start scrape');
          }

          connectStream(data.jobId);
        } catch (err) {
          setIsSubmitting(false);
          setJob((prev) => ({ ...prev, status: 'failed', error: err.message, phase: 'Unable to start' }));
          setInfoMessage(err.message);
        }
      }

      return html`
        <div className="min-h-screen grid-noise">
          <div className="mx-auto w-full max-w-[1360px] px-4 py-5 sm:px-6 lg:px-8">
            <div className="grid grid-cols-1 gap-4 lg:grid-cols-[300px_minmax(0,1fr)]">
              <aside className="rounded-2xl border border-white/15 bg-white/[0.06] p-4 backdrop-blur-xl">
                <div className="mb-6">
                  <p className="inline-flex rounded-full border border-white/15 bg-white/[0.06] px-2.5 py-1 text-[11px] tracking-wide text-slate-200">
                    Multi-Platform Scraper Control
                  </p>
                  <h1 className="mt-3 text-xl font-semibold tracking-tight text-white">Lead Pipeline</h1>
                  <p className="mt-2 text-sm text-slate-300">
                    Submit one scrape run and export only businesses without websites.
                  </p>
                </div>

                <form onSubmit=${handleSubmit} className="space-y-4">
                  <div>
                    <label className="mb-1.5 block text-xs font-medium uppercase tracking-wide text-slate-300">Platform</label>
                    <select
                      value=${platform}
                      onChange=${(e) => setPlatform(e.target.value)}
                      className="w-full rounded-xl border border-white/15 bg-slate-900/90 px-3 py-2.5 text-sm text-slate-100 outline-none transition focus:border-cyan-300/70"
                    >
                      <option value="yelp">Yelp</option>
                      <option value="google_maps">Google Maps</option>
                      <option value="facebook_pages">Facebook Pages</option>
                      <option value="kickstarter">Kickstarter Authors</option>
                      <option value="apollo">Apollo</option>
                    </select>
                  </div>

                  <div>
                    <label className="mb-1.5 block text-xs font-medium uppercase tracking-wide text-slate-300">
                      ${platform === 'kickstarter' ? 'Book Keyword' : platform === 'apollo' ? 'Search Term' : 'Service'}
                    </label>
                    <input
                      value=${keyword}
                      onChange=${(e) => setKeyword(e.target.value)}
                      placeholder=${platform === 'kickstarter' ? 'novel, book, memoir, comic' : platform === 'apollo' ? 'software engineer, CEO, CTO' : 'plumbers, dentists, tree service'}
                      className="w-full rounded-xl border border-white/15 bg-slate-900/90 px-3 py-2.5 text-sm text-slate-100 outline-none transition placeholder:text-slate-400 focus:border-cyan-300/70"
                      required
                    />
                  </div>

                  <div>
                    <label className="mb-1.5 block text-xs font-medium uppercase tracking-wide text-slate-300">
                      ${platform === 'kickstarter' || platform === 'apollo' ? 'Area (Optional)' : 'Area'}
                    </label>
                    <input
                      value=${location}
                      onChange=${(e) => setLocation(e.target.value)}
                      placeholder=${platform === 'kickstarter' || platform === 'apollo' ? 'Optional (e.g. Global)' : 'Brooklyn, NY'}
                      className="w-full rounded-xl border border-white/15 bg-slate-900/90 px-3 py-2.5 text-sm text-slate-100 outline-none transition placeholder:text-slate-400 focus:border-cyan-300/70"
                      required=${platform !== 'kickstarter' && platform !== 'apollo'}
                    />
                  </div>

                  <div>
                    <label className="mb-1.5 block text-xs font-medium uppercase tracking-wide text-slate-300">Domain</label>
                    <select
                      value=${domain}
                      onChange=${(e) => setDomain(e.target.value)}
                      className="w-full rounded-xl border border-white/15 bg-slate-900/90 px-3 py-2.5 text-sm text-slate-100 outline-none transition focus:border-cyan-300/70"
                    >
                      ${platform === 'google_maps' ? html`
                        <option key="google" value="www.google.com">www.google.com</option>
                      ` : platform === 'facebook_pages' ? html`
                        <option key="facebook" value="www.facebook.com">www.facebook.com</option>
                      ` : platform === 'kickstarter' ? html`
                        <option key="kickstarter" value="www.kickstarter.com">www.kickstarter.com</option>
                      ` : platform === 'apollo' ? html`
                        <option key="apollo" value="app.apollo.io">app.apollo.io</option>
                      ` : html`
                        <option key="yelp-us" value="www.yelp.com">www.yelp.com (USA)</option>
                        <option key="yelp-uk" value="www.yelp.co.uk">www.yelp.co.uk (UK)</option>
                        <option key="yelp-ca" value="www.yelp.ca">www.yelp.ca (Canada)</option>
                        <option key="yelp-au" value="www.yelp.com.au">www.yelp.com.au (Australia)</option>
                      `}
                    </select>
                  </div>

                  ${estimate ? html`
                    <div className="rounded-xl border border-white/15 bg-white/[0.05] px-3 py-2 text-xs text-slate-200">
                      Estimated around <span className="font-semibold text-white">${estimate.minutes} min</span>
                      ${' '}based on ${estimate.runsCount} previous run${estimate.runsCount === 1 ? '' : 's'}.
                    </div>
                  ` : null}

                  <button
                    type="submit"
                    disabled=${isSubmitting || isRunning}
                    className="w-full rounded-xl border border-cyan-400/30 bg-cyan-400/10 px-4 py-2.5 text-sm font-semibold text-cyan-200 transition hover:bg-cyan-400/15 disabled:cursor-not-allowed disabled:opacity-60"
                  >
                    ${isRunning || isSubmitting ? 'Scraping...' : 'Start Scraping'}
                  </button>
                </form>

                <div className="mt-6 rounded-xl border border-white/15 bg-white/[0.05] px-3 py-3 text-xs text-slate-300">
                  Keep the Chrome window open during extraction. The dashboard updates through SSE events.
                </div>
              </aside>

              <main className="space-y-4">
                <section className="rounded-2xl border border-white/15 bg-white/[0.05] px-4 py-3 sm:px-5">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <p className="text-[11px] uppercase tracking-wider text-slate-400">Status</p>
                      <p className="mt-1 text-lg font-semibold text-white">${job.phase || 'Ready'}</p>
                      <p className="mt-0.5 text-sm text-slate-300">
                        Platform: ${platformLabel(job.platform)} | Service: ${job.keyword || '-'} | Area: ${job.location || '-'} | Domain: ${job.searchDomain || job.yelpDomain || domain}
                      </p>
                    </div>
                    <span className=${`rounded-full border px-3 py-1 text-xs font-semibold ${statusTone(job.status)}`}>
                      ${job.status || 'idle'}
                    </span>
                  </div>

                  <div className="mt-4 h-2 overflow-hidden rounded-full border border-white/10 bg-slate-900/80">
                    <div
                      className="h-full bg-gradient-to-r from-cyan-400/80 to-blue-300/70 transition-all duration-300"
                      style=${{ width: `${Math.max(0, Math.min(100, Number(job.progress) || 0))}%` }}
                    />
                  </div>
                </section>

                <section className="rounded-2xl border border-white/15 bg-white/[0.05] px-4 py-3 sm:px-5">
                  <div className="grid grid-cols-1 gap-2 sm:grid-cols-3">
                    ${stats.map((stat) => html`
                      <div key=${stat.label} className="rounded-xl border border-white/15 bg-white/[0.05] px-3 py-3">
                        <p className="text-[11px] uppercase tracking-wider text-slate-400">${stat.label}</p>
                        <p className="mt-1 text-2xl font-semibold text-white">${stat.value}</p>
                      </div>
                    `)}
                  </div>
                </section>

                <section className="rounded-2xl border border-white/15 bg-white/[0.05]">
                  <div className="flex items-center justify-between border-b border-white/15 px-4 py-3 sm:px-5">
                    <div>
                      <h2 className="text-sm font-semibold uppercase tracking-wide text-slate-200">Live Lead Feed</h2>
                      <p className="mt-1 text-xs text-slate-400">Newest rows surface first so the stream feels alive while scraping continues.</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="inline-flex items-center rounded-full border border-white/10 bg-white/[0.06] px-2.5 py-1 text-[11px] font-semibold text-slate-300">
                        ${previewRows.length} visible row${previewRows.length === 1 ? '' : 's'}
                      </span>
                      ${isRunning ? html`
                        <span className="inline-flex items-center gap-2 rounded-full border border-cyan-400/25 bg-cyan-400/10 px-2.5 py-1 text-[11px] font-semibold text-cyan-200">
                          <span className="h-2 w-2 animate-pulse rounded-full bg-cyan-300" /> Extracting
                        </span>
                      ` : null}
                    </div>
                  </div>

                  <div className="feed-shell mx-3 mb-3 mt-3 sm:mx-4">
                    <div className="scroll-soft max-h-[68vh] overflow-auto">
                    <table className="min-w-full border-collapse text-sm">
                      <thead className="feed-head">
                        <tr className="border-b border-white/15 text-left text-[11px] uppercase tracking-[0.18em] text-slate-400">
                          <th className="px-5 py-3 font-medium">${job.platform === 'kickstarter' ? 'Author / Publisher' : job.platform === 'apollo' ? 'Contact / Company' : 'Business'}</th>
                          <th className="px-5 py-3 font-medium">${job.platform === 'kickstarter' ? 'Book Title' : job.platform === 'apollo' ? 'Location' : 'Area'}</th>
                          <th className="px-5 py-3 font-medium">Phone</th>
                          <th className="px-5 py-3 font-medium">Email</th>
                          <th className="px-5 py-3 font-medium">Website</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${previewRows.length === 0 ? html`
                          <tr>
                            <td colSpan="5" className="px-5 py-12 text-center text-slate-300">
                              ${isRunning ? 'Extracting leads, this list will populate automatically...' : 'No leads yet.'}
                            </td>
                          </tr>
                        ` : previewRows.map((lead, index) => {
                            const hasWebsite = !!(lead.website && String(lead.website).trim());
                            const liveNumber = Math.max((job.leadsTotal || previewRows.length) - index, 1);

                            return html`
                              <tr
                                key="${escapeHtml(lead.name || 'lead')}-${index}"
                                className="lead-row border-b border-white/10 transition-colors"
                              >
                                <td className="px-5 py-4 align-top">
                                  <div className="lead-name">
                                    <span className="lead-index">${liveNumber}</span>
                                    <div>
                                      <div className="lead-title">${lead.name || '-'}</div>
                                      <div className="lead-subtle">Live row ${liveNumber}</div>
                                    </div>
                                  </div>
                                </td>
                                <td className="px-5 py-4 align-top text-slate-200">
                                  ${job.platform === 'kickstarter' ? (lead.bookTitle || '-') : (lead.address || '-')}
                                </td>
                                <td className="px-5 py-4 align-top text-slate-200">${lead.phone || '-'}</td>
                                <td className="px-5 py-4 align-top text-slate-200">${lead.email || '-'}</td>
                                <td className="px-5 py-4">
                                  ${hasWebsite ? html`
                                    <a href="${lead.website}" target="_blank" className="text-cyan-400 hover:underline">
                                      Visit Website
                                    </a>
                                  ` : html`
                                    <span className="amber-badge rounded-full border border-amber-300/30 bg-amber-400/10 px-2.5 py-1 text-xs font-semibold text-amber-200">
                                      No Website
                                    </span>
                                  `}
                                </td>
                              </tr>
                            `;
                          })}
                      </tbody>
                    </table>
                    </div>
                  </div>
                </section>

                <section className="rounded-2xl border border-white/15 bg-white/[0.05] px-4 py-3 sm:px-5">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <p className="text-sm text-slate-200">${infoMessage}</p>
                    <a
                      href=${isCompleted && job.fileUrl ? job.fileUrl : '#'}
                      className=${`rounded-xl border px-3 py-2 text-xs font-semibold transition ${
                        isCompleted && job.fileUrl
                          ? 'border-emerald-400/30 bg-emerald-400/10 text-emerald-200 hover:bg-emerald-400/15'
                          : 'pointer-events-none border-white/15 bg-white/[0.05] text-slate-400'
                      }`}
                    >
                      Download Filtered Excel
                    </a>
                  </div>
                </section>

                <section className="rounded-2xl border border-white/15 bg-white/[0.05] px-4 py-3 sm:px-5">
                  <h3 className="text-sm font-semibold text-white">Framer Motion Transition Suggestions</h3>
                  <ul className="mt-2 list-disc space-y-1 pl-5 text-xs text-slate-300">
                    <li>Wrap the table body with AnimatePresence and each row with motion.tr.</li>
                    <li>Use initial={'{ opacity: 0, y: 8 }'}, animate={'{ opacity: 1, y: 0 }'}, exit={'{ opacity: 0, y: -6 }'}.</li>
                    <li>Set transition={'{ duration: 0.22, ease: [0.22, 1, 0.36, 1] }'} for a Linear-style feel.</li>
                    <li>When rows update in bulk, add staggerChildren: 0.035 at the tbody level.</li>
                  </ul>
                </section>
              </main>
            </div>
          </div>
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
